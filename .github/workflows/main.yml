name: Deploy to Jino

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: jino-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare deployment files
        run: |
          set -eu

          rm -rf deploy
          mkdir -p deploy

          rsync -a \
            --exclude='.git/' \
            --exclude='catalog/uploads/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='logs/' \
            --exclude='tmp/' \
            ./ deploy/

      - name: Prepare SSH
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' '${{ secrets.JINO_SSH_KEY }}' > ~/.ssh/jino_key
          chmod 600 ~/.ssh/jino_key

          ssh-keyscan -p 2222 \
            "${{ secrets.JINO_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Create SFTP commands
        env:
          JINO_PATH: ${{ secrets.JINO_PATH }}
        run: |
          set -eu

          python3 <<'PY'
          import os
          from pathlib import Path

          root = Path("deploy")
          remote_root = os.environ["JINO_PATH"].rstrip("/")

          commands = []

          for path in sorted(root.rglob("*")):
              if path.is_dir():
                  relative = path.relative_to(root).as_posix()
                  remote = f"{remote_root}/{relative}"
                  commands.append(f'-mkdir "{remote}"')

          for path in sorted(root.rglob("*")):
              if path.is_file():
                  relative = path.relative_to(root).as_posix()
                  local = path.as_posix()
                  remote = f"{remote_root}/{relative}"
                  commands.append(f'put "{local}" "{remote}"')

          Path("sftp_commands.txt").write_text(
              "\n".join(commands) + "\n",
              encoding="utf-8"
          )

          print("SFTP commands created:", len(commands))
          PY

      - name: Deploy via SFTP
        env:
          JINO_USER: ${{ secrets.JINO_USER }}
          JINO_HOST: ${{ secrets.JINO_HOST }}
        run: |
          set -eu

          sftp \
            -i ~/.ssh/jino_key \
            -P 2222 \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -o StrictHostKeyChecking=yes \
            -b sftp_commands.txt \
            "$JINO_USER@$JINO_HOST"
