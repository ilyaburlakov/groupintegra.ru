name: Deploy to Jino

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: jino-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare deployment files
        run: |
          set -eu
          mkdir -p deploy

          rsync -a \
            --exclude='.git/' \
            --exclude='catalog/uploads/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='logs/' \
            --exclude='tmp/' \
            ./ deploy/

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat > ~/.ssh/jino_key <<'EOF'
          ${{ secrets.JINO_SSH_KEY }}
          EOF

          chmod 600 ~/.ssh/jino_key

          ssh-keyscan -p 2222 \
            "${{ secrets.JINO_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Deploy via SFTP
        run: |
          set -eu

          cd deploy

          {
            find . -type d ! -path "." -print | sort | while read -r dir
            do
              echo "-mkdir \"${{ secrets.JINO_PATH }}/${dir#./}\""
            done

            find . -type f -print | sort | while read -r file
            do
              echo "put \"$file\" \"${{ secrets.JINO_PATH }}/${file#./}\""
            done
          } > sftp_commands.txt

          sftp \
            -i ~/.ssh/jino_key \
            -P 2222 \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -o StrictHostKeyChecking=yes \
            -b sftp_commands.txt \
            "${{ secrets.JINO_USER }}@${{ secrets.JINO_HOST }}" <<EOF
          put "$file" "${{ secrets.JINO_PATH }}/$remote"
          EOF
          done
