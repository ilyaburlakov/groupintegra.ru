name: Deploy to Jino

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: jino-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.JINO_USER }}
          server: ${{ secrets.JINO_HOST }}
          port: 2222
          ssh_private_key: ${{ secrets.JINO_SSH_KEY }}
          local_path: './*'
          remote_path: ${{ secrets.JINO_PATH }}
          sftp_only: true
          delete_remote_files: true
          sftpArgs: '-o PubkeyAcceptedAlgorithms=+ssh-rsa'
          exclude: |
            **/.git*
            **/.git*/**
            catalog/uploads/**
            .env
            .env.*
            logs/**
            tmp/**
