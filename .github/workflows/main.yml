name: Repository deployment check

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate VPS deployment script
        run: |
          set -eu
          bash -n deploy/vps-pull.sh
          command -v git >/dev/null
          command -v rsync >/dev/null
          echo "VPS pull deployment script syntax: OK"
          echo "Production deployment is pulled by the Jino VPS from origin/main."

      - name: Validate required production files
        run: |
          set -eu
          test -f .htaccess
          test -f robots.txt
          test -f sitemap.xml
          test -f about.php
          test -f services.php
          test -f projects.php
          test -f privacy.php
          test -f deploy/vps-pull.sh
          echo "Required production files: OK"
